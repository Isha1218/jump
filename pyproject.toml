[project]
name = "jump"
version = "0.1.0"
description = "Say a phrase, land on the page: learns where you go and maps those sites ahead of time."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
jump = "jump.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
